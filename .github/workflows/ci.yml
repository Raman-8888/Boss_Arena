name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run ESLint
      run: npx eslint src/ --ext .js

  java-checkstyle:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Maven Checkstyle
      run: |
        cd leaderboard-api
        mvn checkstyle:check

  build:
    runs-on: ubuntu-latest
    needs: [lint, java-checkstyle]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build frontend
      run: |
        npm install
        npm run build

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Java
      run: |
        cd leaderboard-api
        mvn clean compile

    - name: Trigger Jenkins
      run: |
        curl -X POST https://your-jenkins-url/job/BossRush/build \
          --user your-user:your-token